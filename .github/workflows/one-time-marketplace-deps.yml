name: One-time marketplace dependency install

on:
  push:
    branches:
      - contractor-marketplace

permissions:
  contents: write

jobs:
  install:
    if: contains(github.event.head_commit.message, '[marketplace-deps]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contractor-marketplace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install marketplace dependencies
        run: npm install @supabase/ssr@latest @supabase/supabase-js@latest stripe@latest --save-exact
      - name: Audit
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.arkansaslandpros.com
          NEXT_PUBLIC_SUPABASE_URL: https://nuyvehxarrlezawldabr.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          RESEND_API_KEY: re_test_placeholder
          OPENAI_API_KEY: sk-test-placeholder
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Install marketplace dependencies"
          git push origin HEAD:contractor-marketplace
