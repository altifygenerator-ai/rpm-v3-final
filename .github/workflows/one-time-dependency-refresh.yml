name: One-time dependency security refresh

on:
  push:
    branches:
      - arkansas-land-pros-staging

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[deps-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: arkansas-land-pros-staging
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install secured framework and SDK versions
        run: npm install next@16.3.6 eslint-config-next@16.3.6 resend@6.28.1 --save-exact
      - name: Refresh safe transitive dependencies
        run: npm audit fix || true
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://arkansas-land-pros-staging.example
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          RESEND_API_KEY: re_test_placeholder
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Refresh secured Next and Resend dependencies"
          git push origin HEAD:arkansas-land-pros-staging
