name: One-time OpenAI SDK install

on:
  push:
    branches:
      - arkansas-land-pros-staging

permissions:
  contents: write

jobs:
  install:
    if: contains(github.event.head_commit.message, '[openai-sdk]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: arkansas-land-pros-staging
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install OpenAI SDK
        run: npm install openai@7.23.0 --save-exact
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://arkansas-land-pros-staging.example
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          RESEND_API_KEY: re_test_placeholder
          OPENAI_CHAT_MODEL: gpt-6-luna
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Install OpenAI SDK for project assistant"
          git push origin HEAD:arkansas-land-pros-staging
